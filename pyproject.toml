[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snip2path"
version = "1.2.1"
description = "Screenshot → Ctrl+V pastes image path in terminal, image in chat apps"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=9.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]
authors = [
    {name = "Snip2Path contributors"}
]
keywords = ["screenshot", "clipboard", "windows", "productivity", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
snip2path = "snip2path:main"

[project.urls]
Homepage = "https://github.com/ZijieZh/snip2path"
Repository = "https://github.com/ZijieZh/snip2path"

[tool.setuptools]
py-modules = ["snip2path"]
